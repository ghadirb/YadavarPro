name: Android Builds

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options: [debug, release]
      store:
        description: Store flavor to build
        required: true
        default: all
        type: choice
        options: [direct, bazaar, myket, all]
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store != 'all' && fromJSON(format('["{0}"]', github.event.inputs.store)) || fromJSON('["direct", "bazaar", "myket"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same identity every run. Do NOT generate a new keystore in CI — Cafe Bazaar
      # and Myket reject updates signed with a different certificate.
      - name: Restore release keystore
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "Missing secret RELEASE_KEYSTORE_BASE64. See docs/SIGNING.md"
            exit 1
          }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yadavar-release.jks"
          test -s "$RUNNER_TEMP/yadavar-release.jks"

      - name: Build signed release APK and AAB
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        env:
          KEYSTORE_STORE_FILE: ${{ runner.temp }}/yadavar-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BAZAAR_IAB_PUBLIC_KEY: ${{ secrets.BAZAAR_IAB_PUBLIC_KEY }}
          MYKET_IAB_PUBLIC_KEY: ${{ secrets.MYKET_IAB_PUBLIC_KEY }}
        run: |
          store="${{ matrix.store }}"
          flavor="$(tr '[:lower:]' '[:upper:]' <<< "${store:0:1}")${store:1}"
          ./gradlew ":app:assemble${flavor}Release" ":app:bundle${flavor}Release" --no-daemon

      - name: Upload release APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-${{ matrix.store }}-release-apk
          path: app/build/outputs/apk/${{ matrix.store }}/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-${{ matrix.store }}-release-aab
          path: app/build/outputs/bundle/${{ matrix.store }}Release/*.aab
          if-no-files-found: error

      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug') || github.event_name == 'push' }}
        env:
          BAZAAR_IAB_PUBLIC_KEY: ${{ secrets.BAZAAR_IAB_PUBLIC_KEY }}
          MYKET_IAB_PUBLIC_KEY: ${{ secrets.MYKET_IAB_PUBLIC_KEY }}
        run: |
          store="${{ matrix.store }}"
          flavor="$(tr '[:lower:]' '[:upper:]' <<< "${store:0:1}")${store:1}"
          ./gradlew ":app:assemble${flavor}Debug" --no-daemon

      - name: Upload debug APK
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug') || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-${{ matrix.store }}-debug-apk
          path: app/build/outputs/apk/${{ matrix.store }}/debug/*.apk
          if-no-files-found: error
